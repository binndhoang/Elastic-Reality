<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral Supply - Vibe Coding Prototype</title>
    <style>
        body {
            background-color: #0d0f12; /* Màu nền tối tĩnh tâm */
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        p { color: #8892b0; margin-bottom: 20px; text-align: center; line-height: 1.5; }
        canvas {
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        #status {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            background: #21262d;
            border: 1px solid #30363d;
            transition: all 0.3s ease;
        }
        .win {
            background: rgba(255, 0, 255, 0.2) !important;
            color: #ff00ff;
            border-color: #ff00ff !important;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }
    </style>
</head>
<body>

    <h1>SPECTRAL SUPPLY</h1>
    <p>
        Trạm Đỏ và Xanh đang phát tia sáng. Trạm đích cần màu <b>Tím (Đỏ + Xanh)</b>.<br>
        <b>Click chuột vào lưới</b> để đặt Gương đổi hướng tia sáng (Click = /, Click lần nữa = \, Click = Xóa).
    </p>

    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="status">Trạng thái: Chờ cung cấp nguyên liệu...</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        const SIZE = 50; // Kích thước mỗi ô (8x8 ô)
        const ROWS = 8;
        const COLS = 8;

        // 0: Rỗng, 1: Gương '/', 2: Gương '\'
        let grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));

        // Các trạm phát (Emitters)
        const emitters = [
            { x: 0, y: 2, dx: 1, dy: 0, color: '#ff0000', id: 'red' },   // Tia đỏ bắn sang phải
            { x: 2, y: 0, dx: 0, dy: 1, color: '#0066ff', id: 'blue' }   // Tia xanh dương bắn xuống
        ];

        // Trạm đích (Receiver) cần màu Tím
        const receiver = { x: 7, y: 7, color: '#ff00ff' };

        // Vật cản (Obstacles)
        const obstacles = [
            { x: 3, y: 2 }, { x: 3, y: 3 }, { x: 2, y: 3 }
        ];

        // Xử lý Click chuột để đặt gương
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / SIZE);
            const y = Math.floor((e.clientY - rect.top) / SIZE);

            // Kiểm tra không được đặt gương đè lên Emitter, Receiver hoặc Obstacle
            const isEmitter = emitters.some(em => em.x === x && em.y === y);
            const isReceiver = (receiver.x === x && receiver.y === y);
            const isObstacle = obstacles.some(ob => ob.x === x && ob.y === y);

            if (!isEmitter && !isReceiver && !isObstacle) {
                grid[y][x] = (grid[y][x] + 1) % 3; // Xoay vòng: 0 -> 1 -> 2 -> 0
                draw();
            }
        });

        function draw() {
            // Xóa canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới mờ
            ctx.strokeStyle = '#2a2f3a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
            }

            // Vẽ vật cản
            ctx.fillStyle = '#30363d';
            obstacles.forEach(ob => {
                ctx.fillRect(ob.x * SIZE + 5, ob.y * SIZE + 5, SIZE - 10, SIZE - 10);
            });

            // Vẽ Gương
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (grid[y][x] === 1) { // Gương '/'
                        ctx.beginPath();
                        ctx.moveTo(x * SIZE + 10, y * SIZE + SIZE - 10);
                        ctx.lineTo(x * SIZE + SIZE - 10, y * SIZE + 10);
                        ctx.stroke();
                    } else if (grid[y][x] === 2) { // Gương '\'
                        ctx.beginPath();
                        ctx.moveTo(x * SIZE + 10, y * SIZE + 10);
                        ctx.lineTo(x * SIZE + SIZE - 10, y * SIZE + SIZE - 10);
                        ctx.stroke();
                    }
                }
            }

            // Vẽ Trạm Đích
            ctx.fillStyle = '#222';
            ctx.strokeStyle = receiver.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(receiver.x * SIZE + SIZE/2, receiver.y * SIZE + SIZE/2, SIZE/2 - 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Tính toán và Vẽ Tia Sáng (Core Logic)
            let hits = { red: false, blue: false };

            // Hiệu ứng hòa trộn ánh sáng (Additive Blending)
            ctx.globalCompositeOperation = 'screen'; 
            ctx.lineWidth = 6;

            emitters.forEach(em => {
                let cx = em.x;
                let cy = em.y;
                let dx = em.dx;
                let dy = em.dy;
                let steps = 0;

                ctx.beginPath();
                ctx.moveTo(cx * SIZE + SIZE/2, cy * SIZE + SIZE/2);
                
                // Hiệu ứng Glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = em.color;
                ctx.strokeStyle = em.color;

                while (steps < 100) { // Giới hạn lặp để tránh infinite loop
                    cx += dx;
                    cy += dy;
                    steps++;

                    // Chạm biên
                    if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) {
                        ctx.lineTo(cx * SIZE + SIZE/2 - dx*SIZE, cy * SIZE + SIZE/2 - dy*SIZE);
                        break; 
                    }

                    // Chạm vật cản
                    if (obstacles.some(ob => ob.x === cx && ob.y === cy)) {
                        ctx.lineTo(cx * SIZE + SIZE/2, cy * SIZE + SIZE/2);
                        break;
                    }

                    ctx.lineTo(cx * SIZE + SIZE/2, cy * SIZE + SIZE/2);

                    // Chạm Trạm Đích
                    if (cx === receiver.x && cy === receiver.y) {
                        hits[em.id] = true;
                        break; // Bị hút vào đích
                    }

                    // Tương tác với Gương
                    if (grid[cy][cx] === 1) { // Gương '/'
                        if (dx === 1) { dx = 0; dy = -1; }
                        else if (dx === -1) { dx = 0; dy = 1; }
                        else if (dy === 1) { dx = -1; dy = 0; }
                        else if (dy === -1) { dx = 1; dy = 0; }
                    } else if (grid[cy][cx] === 2) { // Gương '\'
                        if (dx === 1) { dx = 0; dy = 1; }
                        else if (dx === -1) { dx = 0; dy = -1; }
                        else if (dy === 1) { dx = 1; dy = 0; }
                        else if (dy === -1) { dx = -1; dy = 0; }
                    }
                }
                ctx.stroke();
            });

            // Reset hiệu ứng vẽ
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;

            // Vẽ Trạm Phát (Vẽ đè lên tia sáng cho đẹp)
            emitters.forEach(em => {
                ctx.fillStyle = em.color;
                ctx.fillRect(em.x * SIZE + 10, em.y * SIZE + 10, SIZE - 20, SIZE - 20);
            });

            // Kiểm tra kết quả
            if (hits.red && hits.blue) {
                statusDiv.innerText = "HOÀN HẢO! Chuỗi cung ứng đã kích hoạt!";
                statusDiv.className = "win";
                // Đích phát sáng
                ctx.fillStyle = receiver.color;
                ctx.fill();
            } else {
                statusDiv.innerText = "Trạng thái: Chờ cung cấp nguyên liệu...";
                statusDiv.className = "";
            }
        }

        // Vẽ frame đầu tiên
        draw();
    </script>
</body>
</html>
